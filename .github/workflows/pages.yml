# Deploys dist/ (the self-contained UI) to GitHub Pages on every push to main.
# One-time setup: Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
# Sites produced: /            -> dist/index.html (real tool, needs Web Serial)
#                 /mock.html   -> dist/mock.html  (no-hardware demo)
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false # never cancel a deployment mid-flight

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24 # matches the verified toolchain in docs/*/04_FW_Build_Guide
          cache: npm
      - run: npm ci
      - run: npm run build # -> dist/index.html
      - run: node tools/make_mock.mjs # -> dist/mock.html
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
