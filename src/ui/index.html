<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PicoHarness</title>
  <style>/*__STYLE__*/</style>
</head>
<body>
  <header>
    <h1>PicoHarness <small class="subtitle" data-i18n="subtitle">USB CDC</small></h1>
    <span id="status">未连接</span>
    <button id="btn-connect">连接设备</button>
    <button id="btn-ping" data-i18n="btn_ping" disabled>Ping</button>
    <button id="btn-echo" data-i18n="btn_echo" disabled>Echo</button>
    <div id="cfg-wrap">
      <button id="btn-config" data-i18n="btn_config">配置 ▾</button>
      <div id="cfg-menu">
        <button id="cfg-export" data-i18n="cfg_export">导出配置</button>
        <button id="cfg-import" data-i18n="cfg_import">导入配置</button>
        <button id="cfg-reset" data-i18n="cfg_reset">清空配置</button>
        <div class="cfg-note" data-i18n="cfg_note">配置自动存在浏览器里</div>
        <div id="cfg-dev" hidden>
          <div class="cfg-sep"></div>
          <button id="cfg-dev-save" data-i18n="cfg_dev_save">保存到板子</button>
          <button id="cfg-dev-load" data-i18n="cfg_dev_load">从板子载入</button>
          <button id="cfg-dev-clear" data-i18n="cfg_dev_clear">删除板子配置</button>
          <div class="cfg-note" data-i18n="cfg_dev_note">板子里那份只在手动保存时改写</div>
        </div>
      </div>
    </div>
    <button id="btn-lang" title="Switch language">EN</button>
  </header>
  <main>
    <div id="legacy-warn" hidden data-i18n="warn_legacy"></div>
    <section id="gpio" class="idle"></section>
    <section id="scope"></section>
    <div id="console-dock">
      <div id="console-bar">
        <span class="label" data-i18n="console_label">控制台</span>
        <span id="mode-tag">监听</span>
        <span class="spacer"></span>
        <button id="btn-mode">进入 REPL</button>
        <button id="btn-logport" data-i18n="btn_logport" disabled>连接日志口</button>
        <button id="btn-rawstream" data-i18n="btn_rawstream">协议流</button>
        <button id="btn-clear" data-i18n="btn_clear">清屏</button>
        <button id="btn-copy" data-i18n="btn_copy">复制日志</button>
        <button id="btn-export" data-i18n="btn_export">导出</button>
        <button id="btn-collapse" data-i18n="btn_collapse">收起</button>
      </div>
      <div id="console-tabs"></div>
      <div id="term"></div>
      <div id="uart-panes"></div>
    </div>
  </main>
  <script>/*__BUNDLE__*/</script>
</body>
</html>
